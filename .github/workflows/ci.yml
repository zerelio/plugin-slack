name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Check out plugin-sdk
        uses: actions/checkout@v4
        with:
          repository: zerelio/plugin-sdk
          path: ../plugin-sdk

      - name: Build
        run: go build -buildvcs=false ./...

      - name: Test
        run: go test -buildvcs=false ./...
